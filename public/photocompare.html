<!--Create an HTML document that compares two images by overlaying them with adjustable opacity using a slider.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Comparison Slider</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .image-container {
            position: relative;
            width: 600px;
            height: 400px;
            margin: 0 auto;
        }
        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease;
        }
        #image2 {
            opacity: 0.5; /* Initial opacity */
        }
        .slider-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Image Comparison Slider</h1>
    <div class="image-container">
        <img id="image1" src="2006.png" alt="Image 1">
        <img id="image2" src="2007.png" alt="Image 2">
    </div>
    <div class="slider-container">
        <label for="opacitySlider">Adjust Opacity of Image 2:</label>
        <input type="range" id="opacitySlider" min="0" max="100" value="50">
    </div>

    <script>
        const slider = document.getElementById('opacitySlider');
        const image2 = document.getElementById('image2');

        slider.addEventListener('input', function() {
            const opacityValue = slider.value / 100;
            image2.style.opacity = opacityValue;
        });
    </script>
</body>
</html>
